<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <h1>Student Registration Page</h1>
</head>
<from>
    <label for ="Student_Name">Student Name: </label>
    <input type ="text" id="Student_Name" name="Student_Name" placeholder="Enter your name">
    <br><br>

    <label for ="Student_CGPA">Student CGPA: </label>
    <input type ="text" id="Student_CGPA" name="Student_CGPA" placeholder="Enter your CGPA">
    <br><br>

    <label for ="Student_Gender">Student Gender: </label><br><br>
    <input type ="radio" id="Student_Gender" name="Student_Gender" value="Male">
    <label for ="Student_Gender">Male</label><br><br>
    <input type ="radio" id="Student_Gender" name="Student_Gender" value="Female">
    <label for ="Student_Gender">Female</label>
    <br><br>

    <label for ="Select_Department">Select Department: </label>
    <select id="Select_Department" name="Select_Department">
        <option value="Default"></option>
        <option value="CSE">CSE</option>
        <option value="EEE">EEE</option>
        <option value="BBA">BBA</option>
    </select>
    <br><br>

    <label for ="Student_ID">Student ID: </label>
    <input type ="text" id="Student_ID" name="Student_ID" placeholder="xx-xxxxx-x">
    <br><br>

    <label for ="Student_Address">Address: </label>
    <textarea id="Student_Address" name="Student_Address" rows="5" columns="20" placeholder="Enter your address"></textarea>
    <br><br>

    <label for ="Student_DOB">Date of Birth: </label>
    <input type ="date" id="Student_DOB" name="Student_DOB">
    <br><br>

    <label for ="Student_Email">Email: </label>
    <input type ="email" id="Student_Email" name="Student_Email" placeholder="Enter your email">
    <br><br>
    

    
</from>
</html>
