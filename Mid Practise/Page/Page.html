<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Text Analyzer</title>
        <link rel="stylesheet" href="../Design/Style.css">
    </head>
    <body>
        <div class="container">
            <h2>Text Analyzer</h2>
            <label for="inputText">Enter your text:</label><br>
            <textarea id="inputText" rows="6" cols="60" placeholder="Enter some text-"></textarea><br>
            <button id="analyzeButton" onclick="textAnalyze()">Analyze Text</button><br><br>

            <div id="results">
                <p class="labels">
                    <label for="wordCount">Word Count:</label>
                    <span id="wordCount">0</span>
                </p>
                <p class="labels">
                    <label for="charCount">Character Count:</label>
                    <span id="charCount">0</span>
                </p>
                <p class="labels">
                    <label for="reverseSentence">Reversed Sentence:</label>
                    <span id="reverseSentence">-</span>
                </p>
            </div>
    </body>
    <script src="../JS/Script.js"></script>
</html>
